.s-pill {
  padding: 4px 8px; border-radius: 7px; border: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.04); color: #94A3B8; font-size: 11px; font-weight: 700;
  cursor: pointer;
}
.s-pill.on { background: #2563EB; color: #fff; border-color: transparent; }
.s-tool-btn {
  padding: 5px 9px; border-radius: 7px; border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.05); color: #CBD5E1; font-size: 11px; font-weight: 800; cursor: pointer;
}
.s-tool-btn.active { background: rgba(245, 158, 11, 0.2); color: #FBBF24; border-color: rgba(245, 158, 11, 0.4); }

/* Canvas Osciloscopio */
.sensor-canvas-wrapper {
  width: 100%; height: 260px; min-height: 220px;
  background: #0A0F1D; border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  overflow: hidden; position: relative; box-shadow: inset 0 2px 10px rgba(0,0,0,0.6);
}
.sensor-canvas { width: 100%; height: 100%; display: block; }

/* Selector de ejes */
.sensor-legend-bar {
  display: flex; flex-direction: column; gap: 8px;
  background: rgba(255, 255, 255, 0.03); padding: 9px 12px;
  border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.06);
}
.sensor-legend-group { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.sensor-legend-group-title { font-size: 10.5px; font-weight: 900; color: #64748B; width: 34px; }
.s-axis-chip {
  padding: 4px 9px; border-radius: 8px; font-size: 11px; font-weight: 800;
  border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.04);
  color: #64748B; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  transition: all .15s ease;
}
.s-axis-chip .s-axis-dot {
  width: 7px; height: 7px; border-radius: 99px; background: currentColor; opacity: .4;
}
.s-axis-chip.on {
  color: #fff; border-color: var(--ax-col); background: rgba(255, 255, 255, 0.08);
}
.s-axis-chip.on .s-axis-dot { background: var(--ax-col); opacity: 1; box-shadow: 0 0 6px var(--ax-col); }

/* Aviso sensor desconectado */
.sensor-idle-card {
  padding: 14px 16px; border-radius: 14px;
  background: rgba(37, 99, 235, 0.08); border: 1px dashed rgba(56, 189, 248, 0.35);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.sensor-idle-text { font-size: 12.5px; color: #CBD5E1; line-height: 1.5; flex: 1; min-width: 220px; }
.sensor-idle-btns { display: flex; gap: 8px; }

/* Pestaña 3D y Orientación */
.sensor-3d-layout { display: flex; flex-direction: column; gap: 12px; }
.sensor-3d-card, .sensor-horizon-card {
  background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 18px; padding: 14px;
}
.sensor-card-head { font-size: 13px; font-weight: 800; color: #38BDF8; margin-bottom: 12px; }
.sensor-scene-3d {
  width: 100%; height: 210px; display: flex; align-items: center; justify-content: center;
  perspective: 700px; -webkit-perspective: 700px;
}

/* Placa XIAO en CSS 3D */
.xiao-board-3d {
  width: 140px; height: 180px; background: #0E1A2F;
  border: 2px solid #2563EB; border-radius: 16px; position: relative;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 20px rgba(37, 99, 235, 0.25);
  transform-style: preserve-3d; transition: transform 0.06s linear;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.xiao-usbc-port {
  position: absolute; top: -6px; width: 44px; height: 12px;
  background: #CBD5E1; border: 1px solid #94A3B8; border-radius: 4px;
}
.xiao-chip-label { font-size: 9px; font-weight: 900; color: #38BDF8; letter-spacing: .08em; margin-bottom: 8px; }
.xiao-chip-main {
  width: 72px; height: 72px; background: #1E293B; border: 1px solid #475569;
  border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #E2E8F0; font-weight: 900; font-size: 11px;
}
.xiao-chip-main small { font-size: 8px; color: #38BDF8; letter-spacing: .1em; }
.xiao-imu-chip {
  position: absolute; bottom: 38px; font-size: 8px; font-weight: 800;
  color: #94A3B8; background: #1E293B; padding: 2px 5px; border-radius: 4px; border: 1px solid #334155;
}
.xiao-rgb-led {
  position: absolute; bottom: 18px; width: 8px; height: 8px;
  border-radius: 99px; background: #10B981; box-shadow: 0 0 8px #10B981;
}
.xiao-rgb-led.blinking { animation: blink .8s infinite; }
.xiao-pins-left, .xiao-pins-right {
  position: absolute; top: 16px; bottom: 16px; display: flex; flex-direction: column;
  justify-content: space-between;
}
.xiao-pins-left { left: 4px; }
.xiao-pins-right { right: 4px; }
.xiao-pin {
  width: 7px; height: 11px; background: #F59E0B; border-radius: 3px;
  box-shadow: 0 0 4px rgba(245, 158, 11, 0.6);
}
.xiao-3d-hint { font-size: 11px; font-weight: 600; color: #64748B; text-align: center; margin-top: 10px; }

/* Nivel de burbuja */
.level-wrapper { display: flex; align-items: center; justify-content: space-around; gap: 16px; flex-wrap: wrap; }
.bubble-circle {
  width: 120px; height: 120px; border-radius: 99px;
  background: radial-gradient(circle, #0F172A 0%, #060911 100%);
  border: 2px solid rgba(56, 189, 248, 0.35); position: relative; overflow: hidden;
  box-shadow: inset 0 0 16px rgba(0,0,0,0.8), 0 0 12px rgba(56, 189, 248, 0.15);
}
.bubble-cross-x { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(56, 189, 248, 0.25); }
.bubble-cross-y { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: rgba(56, 189, 248, 0.25); }
.bubble-ring-center {
  position: absolute; top: 50%; left: 50%; width: 28px; height: 28px;
  border-radius: 99px; border: 1.5px dashed rgba(56, 189, 248, 0.45);
  transform: translate(-50%, -50%);
}
.bubble-dot {
  position: absolute; top: 50%; left: 50%; width: 18px; height: 18px;
  border-radius: 99px; background: #38BDF8; box-shadow: 0 0 10px #38BDF8;
  transition: transform 0.05s linear; pointer-events: none;
}
.level-angles { display: flex; flex-direction: column; gap: 10px; }
.level-angle-item { display: flex; flex-direction: column; gap: 2px; }
.level-angle-lbl { font-size: 11px; color: #94A3B8; font-weight: 700; }
.level-angle-val { font-size: 22px; font-weight: 900; color: #38BDF8; font-variant-numeric: tabular-nums; }

/* Pestaña Medidores y Gauges */
.sensor-gauges-section { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .sensor-gauges-section { grid-template-columns: 1fr; } }
.sensor-kpi-block {
  background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px; padding: 13px; display: flex; flex-direction: column; gap: 10px;
}
.sensor-block-title { font-size: 12px; font-weight: 800; color: #38BDF8; letter-spacing: .02em; }
.sensor-gauge-rows { display: flex; flex-direction: column; gap: 8px; }
.gauge-row {
  background: rgba(255, 255, 255, 0.03); border-radius: 10px; padding: 7px 9px;
  display: flex; flex-direction: column; gap: 4px;
}
.gauge-row.highlight { background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.2); }
.gauge-row-info { display: flex; justify-content: space-between; align-items: baseline; }
.gauge-lbl { font-size: 11px; font-weight: 800; }
.gauge-val { font-size: 14px; font-weight: 900; color: #F8FAFC; font-variant-numeric: tabular-nums; }

/* Barra Bipolar */
.bipolar-track {
  width: 100%; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, 0.08);
  position: relative; overflow: hidden;
}
.bipolar-center-line {
  position: absolute; left: 50%; top: 0; bottom: 0; width: 1.5px;
  background: rgba(255, 255, 255, 0.35); transform: translateX(-50%); z-index: 2;
}
.bipolar-fill { position: absolute; top: 0; bottom: 0; border-radius: 99px; transition: all 0.05s linear; }

/* Tarjeta VBT */
.sensor-vbt-card {
  background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px; padding: 13px; display: flex; flex-direction: column; gap: 10px;
}
.sensor-vbt-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 480px) { .sensor-vbt-grid { grid-template-columns: 1fr 1fr; } }
.vbt-grid-item {
  background: rgba(255, 255, 255, 0.03); border-radius: 12px; padding: 9px;
  display: flex; flex-direction: column; gap: 3px;
}
.vbt-sub { font-size: 10px; font-weight: 700; color: #94A3B8; }
.vbt-big-num { font-size: 20px; font-weight: 900; color: #F8FAFC; font-variant-numeric: tabular-nums; }
.vbt-big-num small { font-size: 11px; opacity: .7; }
.vbt-phase-pill {
  font-size: 10.5px; font-weight: 800; border-radius: 6px; padding: 3px 6px;
  white-space: nowrap; width: fit-content;
}
.vbt-phase-pill.idle { background: rgba(148, 163, 184, 0.15); color: #94A3B8; }
.vbt-phase-pill.bajada { background: rgba(255, 122, 69, 0.18); color: #FF7A45; }
.vbt-phase-pill.subida { background: rgba(16, 185, 129, 0.2); color: #34D399; }

/* Pestaña Info y Diagnóstico */
.sensor-info-card {
  background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
}
.info-grid { display: flex; flex-direction: column; gap: 8px; }
.info-row {
  display: flex; justify-content: space-between; align-items: center;
  gap: 10px; font-size: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 6px;
}
.info-row:last-child { border-bottom: none; }
.info-k { color: #94A3B8; font-weight: 700; flex-shrink: 0; }
.info-v { color: #F8FAFC; font-weight: 700; text-align: right; }
.font-mono { font-family: monospace; font-size: 11px; }
.copy-btn {
  margin-left: 6px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
  color: #38BDF8; font-size: 10px; font-weight: 800; border-radius: 5px; padding: 2px 6px; cursor: pointer;
}
.info-desc { font-size: 12px; color: #94A3B8; margin: 0; line-height: 1.5; }
.info-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sensor-guide-list { margin: 0; padding-left: 20px; font-size: 12px; color: #CBD5E1; line-height: 1.6; }
.sensor-guide-list code { background: rgba(255, 255, 255, 0.1); padding: 1px 5px; border-radius: 4px; color: #38BDF8; }

@media (prefers-reduced-motion: reduce) {
  *, .bar-fill, .ring-fg, .dot, .day-btn, .rise, .rise-fast { animation: none !important; transition: none !important; }
}
`;

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
