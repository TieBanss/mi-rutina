function parseWeight(w) {
  const m = String(w).match(/^\s*(\d+(?:[.,]\d+)?)\s*(.*)$/);
  if (m) return { num: parseFloat(m[1].replace(",", ".")), suffix: m[2].trim() };
  return { num: null, suffix: String(w) };
}
function fmtNum(n) { return Number.isInteger(n) ? String(n) : String(parseFloat(n.toFixed(2))); }
function compose(n, suffix) { return suffix ? `${fmtNum(n)} ${suffix}` : fmtNum(n); }
function formatDate(t) {
  const d = new Date(t);
  const now = new Date();
  const opts = { day: "2-digit", month: "short" };
  if (d.getFullYear() !== now.getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString("es-ES", opts);
}
function fmtClock(sec) {
  const s = Math.floor(sec);
  const m = Math.floor(s / 60);
  return m + ":" + String(s % 60).padStart(2, "0");
}
function vibrate(p) { if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }

/* ---- cálculos de estado de entrenamiento ---- */
function woElapsed(w) {
  if (!w || w.phase !== "work" || !w.workStart) return 0;
  return Math.max(0, (Date.now() - w.workStart) / 1000);
}
function woRestRemaining(w) {
  if (!w || w.phase !== "rest") return 0;
  if (w.restRunning && w.restEndAt) return Math.max(0, (w.restEndAt - Date.now()) / 1000);
  return w.restRemaining || 0;
}

/* ---------- Confeti ---------- */
function Confetti() {
  const colors = ["#2D7FF9", "#56CCF2", "#FF8A5C", "#FFD166", "#34D399", "#A78BFA"];
  const pieces = Array.from({ length: 48 }, (_, i) => i);
  return (
    <div className="confetti">
      {pieces.map((i) => (
        <span key={i} className="cf" style={{
          left: Math.random() * 100 + "%",
          background: colors[i % colors.length],
          animationDelay: Math.random() * 0.7 + "s",
          animationDuration: 1.8 + Math.random() * 1.4 + "s",
          width: 6 + Math.random() * 6 + "px",
          height: 9 + Math.random() * 8 + "px",
        }} />
      ))}
    </div>
  );
}

/* ---------- Historial de pesos ---------- */
function HistoryPanel({ entries, onClear }) {
  const nums = entries.filter((e) => e.n != null);
  let spark = null;
  if (nums.length >= 2) {
    const vals = nums.map((e) => e.n);
    const min = Math.min(...vals);
    const max = Math.max(...vals);
    const span = max - min || 1;
    const pts = nums.map((e, i) => {
      const x = (i / (nums.length - 1)) * 96 + 2;
      const y = 28 - ((e.n - min) / span) * 22;
      return [x, y];
    });
    const poly = pts.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
    const area = `2,32 ${poly} 98,32`;
    spark = (
      <svg className="spark" viewBox="0 0 100 32" preserveAspectRatio="none">
        <defs>
          <linearGradient id="sparkfill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#2D7FF9" stopOpacity="0.30" />
            <stop offset="100%" stopColor="#2D7FF9" stopOpacity="0" />
          </linearGradient>
        </defs>
        <polygon points={area} fill="url(#sparkfill)" />
        <polyline points={poly} className="spark-line" fill="none" />
        {pts.map((p, i) => (
          <circle key={i} cx={p[0]} cy={p[1]} r="1.6" className="spark-dot" />
        ))}
      </svg>
    );
  }
  const rows = entries.slice().reverse();
  return (
    <div className="hist">
      {spark}
      <div className="hist-list">
        {rows.map((e, idx) => {
          const older = rows[idx + 1];
          const delta = e.n != null && older && older.n != null ? e.n - older.n : null;
          return (
            <div className="hist-row" key={e.t + "-" + idx}>
              <span className="hist-date">{formatDate(e.t)}</span>
              <span className="hist-w">
                {e.w}
                {e.reps != null ? <span className="hist-reps"> · {e.reps} reps</span> : null}
              </span>
              {delta != null && delta !== 0 ? (
                <span className={"hist-delta" + (delta > 0 ? " up" : " down")}>
                  {delta > 0 ? "▲ " : "▼ "}{fmtNum(Math.abs(delta))}
                </span>
              ) : (<span className="hist-delta" />)}
            </div>
          );
        })}
      </div>
      <button className="hist-clear" onClick={onClear}>Borrar historial</button>
    </div>
  );
}

/* ---------- Formulario de ejercicio ---------- */
function ExerciseForm({ initial, globalRest, onSave, onCancel, onDelete }) {
  const [f, setF] = useState({
    name: initial?.name || "",
    sub: initial?.sub || "",
    tip: initial?.tip || "",
    sets: initial?.sets != null ? String(initial.sets) : "3",
    reps: initial?.reps || "10–12",
    weight: initial?.weight || "",
    rest: initial?.rest != null ? String(initial.rest) : "",
  });
  const [confirmDel, setConfirmDel] = useState(false);
  const upd = (k) => (e) => setF({ ...f, [k]: e.target.value });

  function save() {
    if (!f.name.trim()) return;
    let weight = f.weight.trim() || "—";
    if (/^\d+([.,]\d+)?$/.test(weight)) weight = weight.replace(",", ".") + " kg";
    const sets = Math.min(12, Math.max(1, parseInt(f.sets, 10) || 3));
    const restN = f.rest.trim() === "" ? null : Math.max(5, parseInt(f.rest, 10) || globalRest);
    onSave({ name: f.name.trim(), sub: f.sub.trim(), tip: f.tip.trim(), sets, reps: f.reps.trim() || "10", weight, rest: restN });
  }

  return (
    <div className="modal-backdrop" onClick={onCancel}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-grab" />
        <div className="modal-title">{initial ? "Editar ejercicio" : "Nuevo ejercicio"}</div>
        <label className="f-label">Nombre *</label>
        <input className="f-input" value={f.name} onChange={upd("name")} placeholder="Ej: Press de banca" />
        <label className="f-label">Máquina / subtítulo</label>
        <input className="f-input" value={f.sub} onChange={upd("sub")} placeholder="Ej: Máquina, mancuernas…" />
        <label className="f-label">Descripción / consejo</label>
        <textarea className="f-input area" value={f.tip} onChange={upd("tip")} placeholder="Técnica, notas…" rows={2} />
        <div className="f-grid">
          <div>
            <label className="f-label">Series</label>
            <input className="f-input" inputMode="numeric" value={f.sets} onChange={(e) => setF({ ...f, sets: e.target.value.replace(/[^\d]/g, "") })} />
          </div>
          <div>
            <label className="f-label">Reps</label>
            <input className="f-input" value={f.reps} onChange={upd("reps")} placeholder="10–12" />
          </div>
        </div>
        <div className="f-grid">
          <div>
            <label className="f-label">Peso (kg)</label>
            <input className="f-input" value={f.weight} onChange={upd("weight")} placeholder="Ej: 20" />
          </div>
          <div>
            <label className="f-label">Descanso (s)</label>
            <input className="f-input" inputMode="numeric" value={f.rest} onChange={(e) => setF({ ...f, rest: e.target.value.replace(/[^\d]/g, "") })} placeholder={`Global (${globalRest}s)`} />
          </div>
        </div>
        <div className="modal-actions">
          {onDelete && (confirmDel ? (
            <button className="m-btn danger" onClick={onDelete}>¿Seguro? Eliminar</button>
          ) : (
            <button className="m-btn ghost" onClick={() => setConfirmDel(true)}>Eliminar</button>
          ))}
          <div className="modal-actions-right">
            <button className="m-btn ghost" onClick={onCancel}>Cancelar</button>
            <button className="m-btn primary" onClick={save} disabled={!f.name.trim()}>Guardar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- Formulario de día ---------- */

      <div className="modal" onClick={(e) => e.stopPropagation()}>

        <label className="f-label">Enfoque *</label>
        <input className="f-input" value={f.focus} onChange={upd("focus")} placeholder="Ej: Empuje, Piernas, Full body…" />
        <label className="f-label">Grupos musculares</label>
        <input className="f-input" value={f.body} onChange={upd("body")} placeholder="Ej: Pecho · Hombros · Tríceps" />

            <button className="m-btn primary" onClick={() => f.focus.trim() && onSave({ focus: f.focus.trim(), body: f.body.trim(), note: f.note.trim() })} disabled={!f.focus.trim()}>Guardar</button>
          </div>

/* ---------- Modo entrenamiento (controlado) ---------- */
function WorkoutOverlay({ ex, w, doneArr, nextEx, onComplete, onAdvance, onAddTime, onPauseResume, onSetReps, onClose, onNext, onFinish, onStop, bleState, onConnectBle, onOpenSensorMonitor, wavePoints, calib, calibProfile, onCalibStart, onCalibFinish, onCalibCancel, onCalibReset }) {
  const [confirmStop, setConfirmStop] = useState(false);
  const total = ex.sets;
  const phase = w.phase;
  const setIdx = w.setIdx;
  const elapsed = woElapsed(w);
  const remaining = woRestRemaining(w);
  const dispSec = Math.ceil(remaining);
  const mm = Math.floor(dispSec / 60);
  const ss = String(dispSec % 60).padStart(2, "0");
  const frac = w.restTotal > 0 ? Math.min(1, Math.max(0, remaining / w.restTotal)) : 0;
  const isLast = setIdx >= total - 1;
  const durations = w.durations || {};
  const reps = w.reps || "";
  const calibActive = !!(calib && calib.exId === ex.id);

  return (
    <div className="overlay">
      <div className="ov-top">
        <button className="ov-close" onClick={onClose} aria-label="Minimizar">⌄</button>
        <div className="ov-exname">{ex.name}</div>
        <div className="ov-sub">{ex.sub ? ex.sub + " · " : ""}{ex.weight}</div>
        <button className="ov-stop" onClick={() => setConfirmStop(true)} aria-label="Detener ejercicio">⏹</button>
        {confirmStop && (
          <div className="ov-stop-confirm rise-fast">
            <span className="ov-stop-q">¿Detener este ejercicio?</span>
            <div className="ov-stop-btns">
              <button className="t-btn" onClick={() => setConfirmStop(false)}>Cancelar</button>
              <button className="t-btn danger2" onClick={onStop}>Detener</button>
            </div>
          </div>
        )}
      </div>

      <div className="ov-dots">
        {doneArr.map((d, i) => (
          <span key={i} className={"ov-dot" + (d ? " done" : "") + (phase !== "done" && i === setIdx ? " cur" : "")} />
        ))}
      </div>

      {phase === "work" && (
        <div className="ov-body anim" key={"w" + setIdx}>
          <div className="ov-label">Serie</div>
          <div className="ov-big">{setIdx + 1}<span className="ov-of">/ {total}</span></div>
          <div className="ov-target"><span className="ov-target-num">{ex.reps}</span> reps · {ex.weight}</div>
          <div className="ov-stopwatch">
            <span className="ov-sw-dot" />
            {fmtClock(elapsed)}
          </div>
          {ex.tip ? <div className="ov-tip">{ex.tip}</div> : null}

          {bleState?.connected ? (
            <div className="ov-hud rise-fast">
              <div className="ov-hud-head">
                <span className="ov-hud-badge">
                  <span className="hud-live-dot" /> SENSOR VBT
                </span>
                <span className={"ov-hud-phase " + (bleState.phase || "idle").toLowerCase()}>
                  {bleState.phase === "SUBIDA" ? "▲ SUBIENDO" : bleState.phase === "BAJADA" ? "▼ BAJANDO" : "● LISTO"}
                </span>
              </div>
              <div className="ov-hud-grid">
                <div className="hud-metric">
                  <div className="hud-m-val">{bleState.reps}</div>
                  <div className="hud-m-lbl">Reps sensor</div>
                </div>
                <div className="hud-metric highlight">
                  <div className="hud-m-val">
                    {bleState.lastMeanVel > 0 ? bleState.lastMeanVel.toFixed(2) : "—"}
                    <span className="hud-unit">m/s</span>
                  </div>
                  <div className="hud-m-lbl">Vel. Media (VBT)</div>
                </div>
                <div className="hud-metric">
                  <div className="hud-m-val">
                    {bleState.lastPeakVel > 0 ? bleState.lastPeakVel.toFixed(2) : "—"}
                    <span className="hud-unit">m/s</span>
                  </div>
                  <div className="hud-m-lbl">Vel. Pico</div>
                </div>
              </div>
              {wavePoints && (
                <div className="hud-wave-wrap">
                  <svg className="hud-svg" viewBox="0 0 100 24" preserveAspectRatio="none">
                    <line x1="0" y1="12" x2="100" y2="12" stroke="rgba(45,127,249,0.18)" strokeWidth="1" strokeDasharray="2,2" />
                    <polyline points={wavePoints} fill="none" stroke="#2D7FF9" strokeWidth="2" strokeLinecap="round" />
                  </svg>
                </div>
              )}
              <div className={"calib-box" + (calibActive ? " rec" : "")}>
                {calibActive ? (
                  <>
                    <div className="calib-title">🎯 Calibrando · haz 3-5 repeticiones normales</div>
                    <div className="calib-count">{calib.count}<span>movimientos detectados</span></div>
                    <div className="calib-btns">
                      <button className="t-btn" type="button" onClick={onCalibCancel}>Cancelar</button>
                      <button className="t-btn" type="button" onClick={onCalibFinish}>Terminar y guardar</button>
                    </div>
                  </>
                ) : (
                  <>
                    <div className="calib-status">
                      {calibProfile ? `🎯 Calibrado ✓ · ${calibProfile.reps} reps · ~${(calibProfile.medDur / 1000).toFixed(1)}s` : "🎯 Sin calibrar · valores por defecto"}
                    </div>
                    <div className="calib-btns">
                      <button className="t-btn" type="button" onClick={onCalibStart}>{calibProfile ? "Recalibrar" : "Calibrar"}</button>
                      {calibProfile && <button className="t-btn danger2" type="button" onClick={onCalibReset}>Restablecer</button>}
                    </div>
                  </>
                )}
              </div>
              <div className="ov-hud-actions">
                <span className="hud-foot">Barra inmóvil &gt; 3.5s inicia descanso automáticamente</span>
                {onOpenSensorMonitor && (
                  <button className="ov-hud-view-btn" onClick={onOpenSensorMonitor} type="button">
                    📈 Ver osciloscopio completo
                  </button>
                )}
              </div>
            </div>
          ) : (
            <div className="ov-sensor-prompt-box">
              <button className="ov-sensor-prompt" onClick={onConnectBle} type="button">
                <span>📡 Conectar sensor XIAO BLE</span>
                <span className="prompt-sub">Auto-conteo de reps y velocidad VBT en vivo</span>
              </button>
              {onOpenSensorMonitor && (
                <button className="ov-sensor-monitor-link" onClick={onOpenSensorMonitor} type="button">
                  📊 O abrir monitor gráfico (con Demo)
                </button>
              )}
            </div>
          )}

          <button className="ov-main" onClick={onComplete}>✓&nbsp; Serie completada</button>
        </div>
      )}

      {phase === "rest" && (
        <div className="ov-body anim" key="r">
          <div className="ov-label rest">Descanso</div>
          <div className={"ov-ring-wrap" + (w.restRunning ? " pulsing" : "")}>
            <svg width="176" height="176" viewBox="0 0 176 176">
              <circle cx="88" cy="88" r={BIG_R} className="ring-bg" fill="none" strokeWidth="11" />
              <circle cx="88" cy="88" r={BIG_R} className="ring-fg glow" fill="none" strokeWidth="11"
                strokeDasharray={BIG_C} strokeDashoffset={BIG_C * (1 - frac)} transform="rotate(-90 88 88)" />
            </svg>
            <div className="ov-ring-time">{mm}:{ss}</div>
          </div>
          {durations[setIdx] != null && (
            <div className="ov-lastdur">Serie {setIdx + 1}: {durations[setIdx]} s ⏱</div>
          )}
          <div className="ov-next">
            {isLast ? "Última serie completada 🎯" : `Siguiente: serie ${setIdx + 2} de ${total}`}
          </div>
          <div className="ov-rest-controls">
            <button className="t-btn" onClick={() => onAddTime(15)}>+15s</button>
            <button className="t-btn" onClick={onPauseResume}>{w.restRunning ? "Pausa" : "Seguir"}</button>
            <button className="t-btn primary" onClick={onAdvance}>{isLast ? "Terminar →" : "Saltar →"}</button>
          </div>
        </div>
      )}

      {phase === "done" && (
        <div className="ov-body anim" key="d">
          <div className="ov-trophy">💪</div>
          <div className="ov-done-title">¡Ejercicio completado!</div>
          <div className="ov-target">{total} series · {ex.weight}</div>
          {Object.keys(durations).length > 0 && (
            <div className="ov-durs">
              {Array.from({ length: total }, (_, i) =>
                durations[i] != null ? (<span key={i} className="ov-dur">S{i + 1} · {durations[i]}s</span>) : null
              )}
            </div>
          )}
          {bleState?.history?.length > 0 && (
            <div className="ov-vbt-summary">
              <div className="vbt-sum-title">⚡ Resumen de velocidad VBT</div>
              <div className="vbt-reps-list">
                {bleState.history.slice(-total).map((h, idx) => (
                  <span key={idx} className="vbt-rep-chip">
                    R{h.rep}: <b>{h.meanVel.toFixed(2)} m/s</b> ({h.dur.toFixed(1)}s)
                  </span>
                ))}
              </div>
            </div>
          )}
          <div className="ov-reps">
            <div className="ov-reps-label">
              Reps logradas en la última serie
              <span className="ed-reps-goal">objetivo {ex.reps}</span>
            </div>
            <div className="ed-reps-ctrl">
              <button className="rep-step" onClick={() => onSetReps(String(Math.max(0, (parseInt(reps) || 0) - 1)))}>−</button>
              <input className="ed-input reps" inputMode="numeric" value={reps} placeholder="—"
                onChange={(e) => onSetReps(e.target.value.replace(/[^\d]/g, ""))} />
              <button className="rep-step" onClick={() => onSetReps(String((parseInt(reps) || 0) + 1))}>+</button>
            </div>
          </div>
          {nextEx ? (
            <button className="ov-main" onClick={onNext}>Siguiente: {nextEx.name} →</button>
          ) : null}
          <button className={"ov-main" + (nextEx ? " secondary" : "")} onClick={onFinish}>
            {nextEx ? "Finalizar" : "🎉 Terminar — ¡día completo!"}
          </button>
        </div>
      )}
    </div>
  );
}

/* ---------- Barra inferior de entrenamiento activo ---------- */
function WorkoutBar({ ex, w, onReopen }) {
  const total = ex.sets;
  const phase = w.phase;
  if (phase === "work") {
    const elapsed = woElapsed(w);
    return (
      <button className="wo-bar" onClick={onReopen}>
        <span className="wo-ico work"><span className="wo-blink" /></span>
        <span className="wo-info">
          <span className="wo-name">{ex.name}</span>
          <span className="wo-meta">Serie {w.setIdx + 1}/{total} · {ex.weight}</span>
        </span>
        <span className="wo-time">{fmtClock(elapsed)}</span>
        <span className="wo-back">↑</span>
      </button>
    );
  }
  if (phase === "rest") {
    const remaining = woRestRemaining(w);
    const dispSec = Math.ceil(remaining);
    const mm = Math.floor(dispSec / 60);
    const ss = String(dispSec % 60).padStart(2, "0");
    const frac = w.restTotal > 0 ? Math.min(1, Math.max(0, remaining / w.restTotal)) : 0;
    return (
      <button className="wo-bar rest" onClick={onReopen}>
        <span className="wo-ring">
          <svg width="40" height="40" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="16" className="ring-bg" fill="none" strokeWidth="4" />
            <circle cx="20" cy="20" r="16" className="ring-fg" fill="none" strokeWidth="4"
              strokeDasharray={2 * Math.PI * 16} strokeDashoffset={2 * Math.PI * 16 * (1 - frac)} transform="rotate(-90 20 20)" />
          </svg>
        </span>
        <span className="wo-info">
          <span className="wo-name">{ex.name}</span>
          <span className="wo-meta rest">Descanso · serie {Math.min(w.setIdx + 2, total)}/{total}</span>
        </span>
        <span className="wo-time rest">{mm}:{ss}</span>
        <span className="wo-back">↑</span>
      </button>
    );
  }
  return (
    <button className="wo-bar done" onClick={onReopen}>
      <span className="wo-ico done">💪</span>
      <span className="wo-info">
        <span className="wo-name">{ex.name}</span>
        <span className="wo-meta">Completado · toca para finalizar</span>
      </span>
      <span className="wo-back">↑</span>
    </button>
  );
}

/* ---------- Historial de sesiones ---------- */
function SessionsScreen({ sessions, onClose, onExport, onClear }) {
  const [confirmClear, setConfirmClear] = useState(false);
  const groups = (() => {
    const g = [];
    const map = {};
    sessions.slice().reverse().forEach((s) => {
      const d = new Date(s.t);
      const k = d.toLocaleDateString("es-ES", { weekday: "long", day: "2-digit", month: "short", year: "numeric" });
      if (!map[k]) { map[k] = []; g.push([k, map[k]]); }
      map[k].push(s);
    });
    return g;
  })();
  return (
    <div className="overlay sess">
      <div className="ov-top">
        <button className="ov-close" onClick={onClose}>✕</button>
        <div className="ov-exname">Bitácora de sesiones</div>
        <div className="ov-sub">{sessions.length} serie{sessions.length === 1 ? "" : "s"} registrada{sessions.length === 1 ? "" : "s"}</div>
      </div>

      <div className="sess-actions">
        <button className="t-btn primary" onClick={onExport} disabled={sessions.length === 0}>⬇ Exportar CSV</button>
        {confirmClear ? (
          <button className="m-btn danger" onClick={() => { onClear(); setConfirmClear(false); }}>¿Seguro? Borrar todo</button>
        ) : (
          <button className="t-btn ghost" onClick={() => setConfirmClear(true)} disabled={sessions.length === 0}>Borrar</button>
        )}
      </div>

      <div className="sess-list">
        {groups.length === 0 && (
          <div className="sess-empty">
            <span className="empty-ico">📒</span>
            Aún no hay sesiones registradas.<br />
            Completa series con <b>▶ Iniciar ejercicio</b> y aparecerán aquí.
          </div>
        )}
        {groups.map(([date, rows]) => (
          <div className="sess-group rise-fast" key={date}>
            <div className="sess-date">{date}</div>
            {rows.map((s, i) => {
              const d = new Date(s.t);
              const hh = String(d.getHours()).padStart(2, "0");
              const mi = String(d.getMinutes()).padStart(2, "0");
              return (
                <div className="sess-row" key={s.t + "-" + i}>
                  <span className="sess-time">{hh}:{mi}</span>
                  <span className="sess-main">
                    <span className="sess-ex">{s.ex}</span>
                    <span className="sess-detail">Serie {s.set}/{s.of} · {s.w}</span>
                  </span>
                  <span className="sess-dur">{s.dur}s</span>
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------- Monitor Gráfico de Sensores Seeed Studio ---------- */
function SensorMonitorModal({
  bleState,
  telemetryRef,
  onConnect,
  onDisconnect,
  onClose,
  isDemo,
  onStartDemo,
  onStopDemo,
  onClearTelemetry,
  calibCount,
  onExportCalib,
  onImportCalib,
}) {
  const [activeTab, setActiveTab] = useState("chart"); // 'chart' | '3d' | 'kpis' | 'info'
  const [chartMode, setChartMode] = useState("accel"); // 'accel' | 'gyro' | 'dual'
  const [axes, setAxes] = useState({ ax: true, ay: true, az: true, mag: true, gx: true, gy: true, gz: true, gMag: true });
  const [timeWindow, setTimeWindow] = useState(5); // 3, 5, 10 segundos
  const [isPaused, setIsPaused] = useState(false);
  const [copiedUuid, setCopiedUuid] = useState(false);

  // Valores numéricos instantáneos para medidores y 3D
  const [cur, setCur] = useState({
    ax: 0, ay: 0, az: 0, mag: 1, netAcc: 0,
    gx: 0, gy: 0, gz: 0, gMag: 0,
    pitch: 0, roll: 0, hz: 0, packetCount: 0
  });

  const canvasRef = useRef(null);
  const animIdRef = useRef(null);

  // Sincronización del estado de pausa en la ref para el loop del canvas
  const pausedRef = useRef(false);
  pausedRef.current = isPaused;

  // Actualizador para datos numéricos y orientación (a ~16 Hz para suavidad)
  useEffect(() => {
    const timer = setInterval(() => {
      const tel = telemetryRef.current;
      if (!tel) return;
      const history = tel.history;
      const last = history && history.length > 0 ? history[history.length - 1] : null;
      if (last) {
        setCur({
          ax: last.ax || 0,
          ay: last.ay || 0,
          az: last.az || 0,
          mag: last.mag || 1,
          netAcc: last.netAcc || 0,
          gx: last.gx || 0,
          gy: last.gy || 0,
          gz: last.gz || 0,
          gMag: last.gMag || 0,
          pitch: last.pitch || 0,
          roll: last.roll || 0,
          hz: tel.hz || 0,
          packetCount: tel.packetCount || 0
        });
      } else {
        setCur((c) => ({ ...c, hz: tel.hz || 0, packetCount: tel.packetCount || 0 }));
      }
    }, 60);
    return () => clearInterval(timer);
  }, [telemetryRef]);

  // Dibujado del Osciloscopio a 60 FPS con Canvas HiDPI
  useEffect(() => {
    if (activeTab !== "chart") return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    if (!ctx) return;

    let running = true;

    function render() {
      if (!running) return;
      animIdRef.current = requestAnimationFrame(render);

      // Adaptación HiDPI
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const w = Math.floor(rect.width * dpr);
      const h = Math.floor(rect.height * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }

      ctx.save();
      ctx.scale(dpr, dpr);
      const cw = rect.width;
      const ch = rect.height;

      // Fondo oscuro de laboratorio
      ctx.fillStyle = "#0A0F1D";
      ctx.fillRect(0, 0, cw, ch);

      // Rejilla de osciloscopio
      ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
      ctx.lineWidth = 1;
      const gridGap = 28;
      for (let x = 0; x < cw; x += gridGap) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, ch);
        ctx.stroke();
      }
      for (let y = 0; y < ch; y += gridGap) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
        ctx.stroke();
      }

      const tel = telemetryRef.current;
      const history = tel ? tel.history : [];
      const samplesToShow = Math.round(timeWindow * 40);
      const dataSlice = history.slice(-samplesToShow);

      if (chartMode === "dual") {
        renderSection(ctx, dataSlice, 0, ch / 2, cw, "accel");
        renderSection(ctx, dataSlice, ch / 2, ch / 2, cw, "gyro");
      } else {
        renderSection(ctx, dataSlice, 0, ch, cw, chartMode);
      }

      ctx.restore();
    }

    function renderSection(ctx, data, topY, height, width, mode) {
      const centerY = topY + height / 2;
      const isAccel = mode === "accel";

      // Línea de cero central
      ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
      ctx.lineWidth = 1.2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(0, centerY);
      ctx.lineTo(width, centerY);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "rgba(148, 163, 184, 0.75)";
      ctx.font = "10px Inter, monospace";
      ctx.textAlign = "left";

      if (isAccel) {
        const rangeG = 2.5;
        const scaleY = (height / 2) / rangeG;

        [2.0, 1.0, -1.0, -2.0].forEach((gVal) => {
          const y = centerY - gVal * scaleY;
          if (y >= topY && y <= topY + height) {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.07)";
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
            ctx.fillText((gVal > 0 ? "+" : "") + gVal.toFixed(1) + "G", 6, y - 3);
          }
        });
        ctx.fillText("0G", 6, centerY - 3);

        ctx.fillStyle = "#94A3B8";
        ctx.font = "bold 11px Inter, sans-serif";
        ctx.fillText("ACELERÓMETRO (G)", width - 135, topY + 16);

        if (data.length > 1) {
          if (axes.mag) drawLine(ctx, data, (d) => centerY - d.mag * scaleY, "#F59E0B", width);
          if (axes.az) drawLine(ctx, data, (d) => centerY - d.az * scaleY, "#38BDF8", width);
          if (axes.ay) drawLine(ctx, data, (d) => centerY - d.ay * scaleY, "#10B981", width);
          if (axes.ax) drawLine(ctx, data, (d) => centerY - d.ax * scaleY, "#FF5555", width);
        }
      } else {
        const rangeDps = 500;
        const scaleY = (height / 2) / rangeDps;

        [250, -250].forEach((degVal) => {
          const y = centerY - degVal * scaleY;
          if (y >= topY && y <= topY + height) {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.07)";
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
            ctx.fillText((degVal > 0 ? "+" : "") + degVal + "°/s", 6, y - 3);
          }
        });
        ctx.fillText("0°/s", 6, centerY - 3);

        ctx.fillStyle = "#94A3B8";
        ctx.font = "bold 11px Inter, sans-serif";
        ctx.fillText("GIROSCOPIO (°/s)", width - 125, topY + 16);

        if (data.length > 1) {
          if (axes.gMag) drawLine(ctx, data, (d) => centerY - d.gMag * scaleY, "#F59E0B", width);
          if (axes.gz) drawLine(ctx, data, (d) => centerY - d.gz * scaleY, "#F43F5E", width);
          if (axes.gy) drawLine(ctx, data, (d) => centerY - d.gy * scaleY, "#06B6D4", width);
          if (axes.gx) drawLine(ctx, data, (d) => centerY - d.gx * scaleY, "#A855F7", width);
        }
      }
    }

    function drawLine(ctx, data, getY, color, width) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.shadowColor = color;
      ctx.shadowBlur = 4;
      ctx.beginPath();

      const stepX = width / Math.max(data.length - 1, 1);
      data.forEach((d, i) => {
        const x = i * stepX;
        const y = getY(d);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Punto en la última muestra a la derecha
      if (data.length > 0) {
        const lastD = data[data.length - 1];
        const lastX = (data.length - 1) * stepX;
        const lastY = getY(lastD);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(lastX, lastY, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    render();

    return () => {
      running = false;
      if (animIdRef.current) cancelAnimationFrame(animIdRef.current);
    };
  }, [activeTab, chartMode, axes, timeWindow]);

  function toggleAxis(k) {
    setAxes((a) => ({ ...a, [k]: !a[k] }));
  }

  function handleCopyUuid() {
    try {
      navigator.clipboard.writeText("19b10000-e8f2-537e-4f6c-d104768a1214");
      setCopiedUuid(true);
      setTimeout(() => setCopiedUuid(false), 2000);
    } catch (e) {}
  }

  function exportCSV() {
    const history = telemetryRef.current?.history || [];
    if (history.length === 0) {
      alert("Aún no hay datos acumulados para exportar.");
      return;
    }
    const header = "Timestamp_ms,Ax_G,Ay_G,Az_G,Mag_G,Gx_dps,Gy_dps,Gz_dps,Pitch_deg,Roll_deg";
    const rows = history.map((s) =>
      [s.t, s.ax.toFixed(4), s.ay.toFixed(4), s.az.toFixed(4), s.mag.toFixed(4), s.gx, s.gy, s.gz, s.pitch.toFixed(1), s.roll.toFixed(1)].join(",")
    );
    const csv = "\uFEFF" + [header].concat(rows).join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `seeed-telemetria-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-")}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // Burbuja para el nivel digital (clamp en +/- 42px)
  const bubbleX = Math.max(-42, Math.min(42, (cur.roll / 45) * 42));
  const bubbleY = Math.max(-42, Math.min(42, (-cur.pitch / 45) * 42));

  // Ayudante de barra bipolar (-val a +val con centro al 50%)
  function renderBipolarBar(val, maxRange, color) {
    const clamped = Math.max(-maxRange, Math.min(maxRange, val));
    const pct = Math.abs(clamped / maxRange) * 50;
    const isPos = clamped >= 0;
    return (
      <div className="bipolar-track">
        <div className="bipolar-center-line" />
        <div
          className="bipolar-fill"
          style={{
            left: isPos ? "50%" : `${50 - pct}%`,
            width: `${pct}%`,
            background: color,
          }}
        />
      </div>
    );
  }

  return (
    <div className="sensor-modal-backdrop" onClick={onClose}>
      <div className="sensor-modal rise" onClick={(e) => e.stopPropagation()}>
        {/* Encabezado */}
        <div className="sensor-head">
          <div className="sensor-head-info">
            <div className="sensor-head-title">
              <span className="sensor-chip-icon">⚡</span>
              <span>Telemetría Seeed Studio</span>
              <span className="sensor-chip-model">XIAO BLE Sense</span>
            </div>
            <div className="sensor-status-bar">
              {bleState.connected ? (
                <span className="sensor-badge on">
                  <span className="s-dot on" /> CONECTADO ({bleState.deviceName || "MiRutina"})
                </span>
              ) : isDemo ? (
                <span className="sensor-badge demo">
                  <span className="s-dot demo" /> MODO DEMO ACTIVO (~40 Hz)
                </span>
              ) : bleState.connecting ? (
                <span className="sensor-badge busy">
                  <span className="s-dot busy" /> BUSCANDO BLE...
                </span>
              ) : (
                <span className="sensor-badge off">
                  <span className="s-dot off" /> DESCONECTADO
                </span>
              )}
              <span className="sensor-rate-text">
                {cur.hz > 0 ? `${cur.hz} Hz` : "0 Hz"} · {cur.packetCount.toLocaleString()} paquetes
              </span>
            </div>
          </div>
          <div className="sensor-head-actions">
            {bleState.connected ? (
              <button className="s-btn danger" onClick={onDisconnect}>Desconectar</button>
            ) : (
              <button className="s-btn primary" onClick={onConnect} disabled={bleState.connecting}>
                {bleState.connecting ? "Conectando..." : "📡 Conectar BLE"}
              </button>
            )}
            <button className="s-close-btn" onClick={onClose} aria-label="Cerrar">✕</button>
          </div>
        </div>

        {/* Pestañas */}
        <div className="sensor-tabs">
          <button className={"s-tab" + (activeTab === "chart" ? " active" : "")} onClick={() => setActiveTab("chart")}>
            📈 Osciloscopio
          </button>
          <button className={"s-tab" + (activeTab === "3d" ? " active" : "")} onClick={() => setActiveTab("3d")}>
            🧊 Orientación 3D
          </button>
          <button className={"s-tab" + (activeTab === "kpis" ? " active" : "")} onClick={() => setActiveTab("kpis")}>
            📊 Medidores
          </button>
          <button className={"s-tab" + (activeTab === "info" ? " active" : "")} onClick={() => setActiveTab("info")}>
            ℹ️ Diagnóstico
          </button>
        </div>

        {/* Contenido según pestaña */}
        {activeTab === "chart" && (
          <div className="sensor-view-body">
            {/* Barra de controles del Osciloscopio */}
            <div className="sensor-chart-toolbar">
              <div className="s-tgroup">
                <span className="s-lbl">Modo:</span>
                <button className={"s-pill" + (chartMode === "accel" ? " on" : "")} onClick={() => setChartMode("accel")}>Acelerómetro</button>
                <button className={"s-pill" + (chartMode === "gyro" ? " on" : "")} onClick={() => setChartMode("gyro")}>Giroscopio</button>
                <button className={"s-pill" + (chartMode === "dual" ? " on" : "")} onClick={() => setChartMode("dual")}>Dual</button>
              </div>

              <div className="s-tgroup">
                <span className="s-lbl">Ventana:</span>
                {[3, 5, 10].map((sec) => (
                  <button key={sec} className={"s-pill" + (timeWindow === sec ? " on" : "")} onClick={() => setTimeWindow(sec)}>
                    {sec}s
                  </button>
                ))}
              </div>

              <div className="s-tgroup right">
                <button className={"s-tool-btn" + (isPaused ? " active" : "")} onClick={() => {

/* ---------- Calibración de ejercicios (patrón de ciclo por ejercicio) ---------- */
const CALIB_KEY = "calib_v1";
const CALIB_TPL_N = 32;
const CALIB_ACT = 0.08;      // umbral de actividad (G, aceleración neta filtrada)
const CALIB_GAP_MS = 400;    // pausa que separa un movimiento del siguiente
const CALIB_MIN_BURST_MS = 350;

function calibClamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function calibMedian(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function calibResampleZ(trace, n) {
  const out = new Array(n);
  const L = trace.length;
  if (L < 2) return out.fill(0);
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * (L - 1);
    const i0 = Math.floor(x), i1 = Math.min(L - 1, i0 + 1), fr = x - i0;
    out[i] = trace[i0] * (1 - fr) + trace[i1] * fr;
  }
  const mean = out.reduce((a, b) => a + b, 0) / n;
  let sd = Math.sqrt(out.reduce((a, b) => a + (b - mean) * (b - mean), 0) / n);
  if (sd < 1e-6) sd = 1;
  return out.map((v) => (v - mean) / sd);
}
function calibPearson(a, b) {
  const n = Math.min(a.length, b.length);
  if (!n) return 0;
  let s = 0;
  for (let i = 0; i < n; i++) s += a[i] * b[i];
  return s / n; // ambas ya están normalizadas (media 0, desv. 1)
}
/* Segmenta la señal en "movimientos" (ráfagas de actividad separadas por pausas) */
function calibSegmentBursts(samples, closeOpen) {
  const bursts = [];
  let cur = null, lastActive = 0;
  const close = () => {
    const dur = cur.end - cur.start;
    if (dur >= CALIB_MIN_BURST_MS) {
      const tr = samples.slice(cur.i0, cur.i1 + 1).map((s) => s.f);
      bursts.push({ dur, max: Math.max(...tr), min: Math.min(...tr), trace: tr });
    }
    cur = null;
  };
  for (let i = 0; i < samples.length; i++) {
    const s = samples[i];
    if (Math.abs(s.f) > CALIB_ACT) {
      if (!cur) cur = { start: s.t, end: s.t, i0: i, i1: i };
      cur.end = s.t; cur.i1 = i; lastActive = s.t;
    } else if (cur && s.t - lastActive > CALIB_GAP_MS) {
      close();
    }
  }
  if (cur && closeOpen) close();
  return bursts;
}
/* Reproduce la misma máquina de estados de detección sobre las muestras grabadas */
function calibReplayReps(samples, P) {
  let phase = "IDLE", start = 0, trace = [];
  const reps = [];
  for (const s of samples) {
    const f = s.f, t = s.t;
    if (phase === "IDLE") {
      if (f < P.down) { phase = "BAJADA"; start = t; trace = [f]; }
      else if (f > P.up) { phase = "SUBIDA"; start = t; trace = [f]; }
    } else if (phase === "BAJADA") {
      trace.push(f);
      if (f > P.up && t - start > 200) phase = "SUBIDA";
    } else {
      trace.push(f);
      if (f <= P.quiet && t - start >= P.minRepMs) { reps.push({ dur: t - start, trace }); phase = "IDLE"; }
    }
  }
  return reps;
}
function calibBuildProfile(samples) {
  const bursts = calibSegmentBursts(samples, true);
  if (bursts.length < 2) return { ok: false, msg: "Se detectaron menos de 2 movimientos. Repite con 3-5 reps." };
  const medMax = calibMedian(bursts.map((b) => b.max));
  const medMin = calibMedian(bursts.map((b) => b.min));
  if (Math.max(medMax, -medMin) < 0.1) return { ok: false, msg: "Señal muy débil. Revisa que el sensor esté firme en la barra." };
  const up = calibClamp(0.5 * medMax, 0.08, 0.4);
  const down = -calibClamp(0.5 * -medMin, 0.08, 0.4);
  let quiet = calibClamp(0.25 * Math.min(medMax, -medMin), 0.04, 0.1);
  quiet = Math.min(quiet, 0.8 * Math.min(up, -down));
  const P = { up, down, quiet, minRepMs: 300 };
  const reps = calibReplayReps(samples, P);
  if (reps.length < 2) return { ok: false, msg: "No se pudo aislar el ciclo. Repite con movimientos más marcados." };
  const medDur = calibMedian(reps.map((r) => r.dur));
  const good = reps.filter((r) => r.dur >= 0.4 * medDur && r.dur <= 2.5 * medDur);
  if (good.length < 2) return { ok: false, msg: "Las repeticiones fueron muy distintas entre sí. Repite con ritmo parejo." };
  const gd = good.map((r) => r.dur);
  const minRepMs = Math.max(300, Math.round(0.6 * Math.min(...gd)));
  const maxRepMs = Math.round(1.8 * Math.max(...gd));
  const zs = good.map((r) => calibResampleZ(r.trace, CALIB_TPL_N));
  const tplRaw = new Array(CALIB_TPL_N).fill(0).map((_, i) => zs.reduce((a, z) => a + z[i], 0) / zs.length);
  const mean = tplRaw.reduce((a, b) => a + b, 0) / CALIB_TPL_N;
  let sd = Math.sqrt(tplRaw.reduce((a, b) => a + (b - mean) * (b - mean), 0) / CALIB_TPL_N);
  if (sd < 1e-6) sd = 1;
  const tpl = tplRaw.map((v) => Math.round(((v - mean) / sd) * 1000) / 1000);
  const corrs = zs.map((z) => calibPearson(z, tpl));
  const minCorr = calibClamp(Math.min(...corrs) - 0.2, 0.25, 0.6);
  return {
    ok: true,
    profile: {
      v: 1, ts: Date.now(), reps: good.length, bursts: bursts.length,
      up: Math.round(up * 1000) / 1000, down: Math.round(down * 1000) / 1000, quiet: Math.round(quiet * 1000) / 1000,
      minRepMs, maxRepMs, minCorr: Math.round(minCorr * 100) / 100, tpl, medDur: Math.round(medDur),
    },
  };
}
/* ¿El movimiento detectado coincide con el patrón calibrado? */
function calibMatches(P, trace, durMs) {
  if (durMs > P.maxRepMs) return false;
  if (!P.tpl || !P.tpl.length) return true;
  return calibPearson(calibResampleZ(trace, CALIB_TPL_N), P.tpl) >= P.minCorr;
}

  const [history, setHistory] = useState(() => {

  const [sessions, setSessions] = useState(() => {

  const [calibProfiles, setCalibProfiles] = useState(() => {

  const calibProfilesRef = useRef(calibProfiles);
  const [calib, setCalib] = useState(null); // { exId, count } mientras se calibra
  const calibRef = useRef(null);
  const activeExIdRef = useRef(null);
  const [settings, setSettings] = useState(() => {

  const [dayIdx, setDayIdx] = useState(0);
  const [setsDone, setSetsDone] = useState({});
  const [editingEx, setEditingEx] = useState(null);

  function processSensorSample(ax, ay, az, gx, gy, gz) {
    const now = Date.now();
    const tel = telemetryRef.current;
    tel.packetCount++;
    tel.hzPackets++;

    if (now - tel.lastHzTime >= 1000) {
      tel.hz = Math.round(((tel.hzPackets * 1000) / (now - tel.lastHzTime)) * 10) / 10;
      tel.hzPackets = 0;
      tel.lastHzTime = now;
    }

    const rawMag = Math.sqrt(ax * ax + ay * ay + az * az);
    const gMag = Math.sqrt(gx * gx + gy * gy + gz * gz);
    const pitch = Math.atan2(ay, Math.sqrt(ax * ax + az * az)) * (180 / Math.PI);
    const roll = Math.atan2(-ax, az) * (180 / Math.PI);
    const netAcc = rawMag - 1.0;

    if (!tel.paused) {
      tel.history.push({
        t: now,
        ax, ay, az,
        gx, gy, gz,
        mag: rawMag,
        gMag,
        pitch, roll,
        netAcc
      });
      if (tel.history.length > tel.maxSamples) {
        tel.history.shift();
      }
    }

    // DSP para detección de repeticiones y VBT
    const dsp = dspRef.current;
    const dt = dsp.lastTimestamp ? Math.min(0.06, Math.max(0.01, (now - dsp.lastTimestamp) / 1000.0)) : 0.025;
    dsp.lastTimestamp = now;

    const ALPHA = 0.22;
    dsp.filteredAcc = ALPHA * netAcc + (1.0 - ALPHA) * dsp.filteredAcc;
    const fAcc = dsp.filteredAcc;

    const wave = dsp.recentAcel;
    wave.push(fAcc);
    if (wave.length > 24) wave.shift();

    const accLineal = fAcc * 9.80665;
    const P = calibProfilesRef.current[activeExIdRef.current] || null;
    const UMBRAL_BAJADA = P ? P.down : -0.16;
    const UMBRAL_SUBIDA = P ? P.up : 0.18;
    const UMBRAL_QUIETO = P ? P.quiet : 0.07;
    const MIN_REP_MS = P ? P.minRepMs : 600;
    const REST_TRIGGER_MS = 3600;

    let phaseChanged = false;

    if (calibRef.current) calibCapture(now, fAcc);
    const prevPhase = dsp.phase;
    if (prevPhase !== "IDLE") dsp.repTrace.push(fAcc);

    // mientras se calibra no se cuentan reps
    switch (calibRef.current ? "CALIB" : dsp.phase) {
      case "IDLE":
        dsp.vel = 0;
        dsp.maxVel = 0;
        dsp.velSum = 0;
        dsp.velSamples = 0;

        if (fAcc < UMBRAL_BAJADA) {
          dsp.phase = "BAJADA";
          dsp.repStartTime = now;
          dsp.lastMovementTime = now;
          phaseChanged = true;
        } else if (fAcc > UMBRAL_SUBIDA) {
          dsp.phase = "SUBIDA";
          dsp.repStartTime = now;
          dsp.concentricStartTime = now;
          dsp.lastMovementTime = now;
          phaseChanged = true;
        }

        if (dsp.repsCount > 0 && Math.abs(fAcc) < UMBRAL_QUIETO) {
          if (now - dsp.lastMovementTime > REST_TRIGGER_MS) {
            dsp.repsCount = 0;
            dsp.lastMovementTime = now;
            setTimeout(() => woComplete(), 10);
            showToast("🎯 Fin de serie detectado (barra en soporte)");
          }
        }
        break;

      case "BAJADA":
        dsp.lastMovementTime = now;
        if (fAcc > UMBRAL_SUBIDA && now - dsp.repStartTime > 200) {
          dsp.phase = "SUBIDA";
          dsp.concentricStartTime = now;
          dsp.vel = 0;
          phaseChanged = true;
        }
        break;

      case "SUBIDA":
        dsp.lastMovementTime = now;
        dsp.vel += accLineal * dt;
        if (dsp.vel < 0) dsp.vel = 0;
        if (dsp.vel > dsp.maxVel) dsp.maxVel = dsp.vel;
        dsp.velSum += dsp.vel;
        dsp.velSamples++;

        if (P && fAcc <= UMBRAL_QUIETO && now - dsp.repStartTime >= MIN_REP_MS && !calibMatches(P, dsp.repTrace, now - dsp.repStartTime)) {
          // movimiento que no coincide con el patrón calibrado: se descarta
          dsp.phase = "IDLE";
          phaseChanged = true;
        } else if (fAcc <= UMBRAL_QUIETO && now - dsp.repStartTime >= MIN_REP_MS) {
          dsp.repsCount++;
          const duration = (now - dsp.repStartTime) / 1000.0;
          const meanVel = dsp.velSamples > 0 ? dsp.velSum / dsp.velSamples : dsp.maxVel;
          const peakVel = dsp.maxVel;

          dsp.phase = "IDLE";
          phaseChanged = true;

          vibrate(25);

          setWorkout((w) => {
            if (w && w.phase === "work") {
              return { ...w, reps: String(dsp.repsCount) };
            }
            return w;
          });

          setBleState((s) => ({
            ...s,
            reps: dsp.repsCount,
            lastMeanVel: meanVel,
            lastPeakVel: peakVel,
            lastDuration: duration,
            history: [...s.history, { rep: dsp.repsCount, meanVel, peakVel, dur: duration, t: now }],
          }));
        }
        break;
    }

    if (prevPhase === "IDLE" && dsp.phase !== "IDLE") dsp.repTrace = [fAcc];

    if (phaseChanged || now - (dsp._lastUiUpdate || 0) > 80) {
      dsp._lastUiUpdate = now;
      setBleState((s) => ({
        ...s,
        phase: dsp.phase,
        raw: { ax, ay, az, gx, gy, gz, mag: rawMag, netAcc: fAcc },
      }));
    }
  }

  function handleBleNotification(event) {
    const val = event.target.value;
    if (val.byteLength < 12) return;

    const ax = val.getInt16(0, true) / 1000.0;
    const ay = val.getInt16(2, true) / 1000.0;
    const az = val.getInt16(4, true) / 1000.0;
    const gx = val.getInt16(6, true);
    const gy = val.getInt16(8, true);
    const gz = val.getInt16(10, true);

    processSensorSample(ax, ay, az, gx, gy, gz);
  }

    const n = Math.max(0, Math.round((cur + d) * 100) / 100);
    setEditVal(fmtNum(n));
    updateExercise(editingEx, { weight: compose(n, editSuffix) });
  }
  function commitText(v) { setEditVal(v); updateExercise(editingEx, { weight: v }); }
  function changeDay(i) {
    finalizeEdit();
    setEditingEx(null); setHistOpen(null); setSummaryOpen(false);
    setDayIdx(i);
  }

  /* ---- audio ---- */
  function ensureAudio() {
    try {
      if (!audioRef.current) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioRef.current = new Ctx();
      }
      if (audioRef.current && audioRef.current.state === "suspended") audioRef.current.resume();
    } catch (e) {}
  }
  function fireAlarm() {
    vibrate([220, 120, 220, 120, 220]);
    if (!settings.soundOn) return;
    try {
      const ctx = audioRef.current;
      if (!ctx) return;
      [0, 0.28, 0.56].forEach((t) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = "sine"; o.frequency.value = 920;
        const start = ctx.currentTime + t;
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(0.35, start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);
        o.start(start); o.stop(start + 0.24);
      });
    } catch (e) {}
  }

  /* ---- entrenamiento ---- */
  function startWorkout(exId) {
    ensureAudio();
    resetSensorReps();
    const ex = exById(exId);
    if (!ex) return;
    const arr = getArr(ex);
    const firstInc = arr.findIndex((d) => !d);
    setWorkout({
      exId,
      phase: firstInc === -1 ? "done" : "work",
      setIdx: firstInc === -1 ? ex.sets - 1 : firstInc,
      durations: {},
      workStart: firstInc === -1 ? null : Date.now(),
      restEndAt: null, restTotal: 0, restRunning: false, restRemaining: 0,
      reps: "",
    });
    setOverlayOpen(true);
  }
  function woComplete() {
    ensureAudio();
    vibrate(20);
    setWorkout((w) => {
      if (!w) return w;
      const ex = exById(w.exId);
      const dur = w.workStart ? Math.max(1, Math.round((Date.now() - w.workStart) / 1000)) : 0;
      const si = w.setIdx;
      markSetDone(w.exId, si);
      logSessionSet(ex, si, dur);
      const restSec = ex.rest != null ? ex.rest : settings.globalRest;
      return { ...w, durations: { ...w.durations, [si]: dur }, phase: "rest", restTotal: restSec, restRunning: true, restEndAt: Date.now() + restSec * 1000, restRemaining: restSec };
    });
  }
  function woAdvance() {
    resetSensorReps();
    setWorkout((w) => {
      if (!w) return w;
      const ex = exById(w.exId);
      if (w.setIdx >= ex.sets - 1) {
        return { ...w, phase: "done", restRunning: false, restEndAt: null, restRemaining: 0 };
      }
      return { ...w, setIdx: w.setIdx + 1, phase: "work", workStart: Date.now(), restRunning: false, restEndAt: null, restRemaining: 0 };
    });
  }
  function woAddTime(s) {
    setWorkout((w) => {
      if (!w) return w;
      if (w.restRunning) return { ...w, restEndAt: (w.restEndAt || Date.now()) + s * 1000, restTotal: w.restTotal + s };
      return { ...w, restRemaining: (w.restRemaining || 0) + s, restTotal: w.restTotal + s };
    });
  }
  function woPauseResume() {
    setWorkout((w) => {
      if (!w) return w;
      if (w.restRunning) {
        const rem = Math.max(0, (w.restEndAt - Date.now()) / 1000);
        return { ...w, restRunning: false, restEndAt: null, restRemaining: rem };
      } else if ((w.restRemaining || 0) > 0) {
        ensureAudio();
        return { ...w, restRunning: true, restEndAt: Date.now() + w.restRemaining * 1000 };
      }
      return w;
    });
  }
  function woSetReps(v) { setWorkout((w) => (w ? { ...w, reps: v } : w)); }
  function logWorkoutReps() {
    if (!workout) return;
    const ex = exById(workout.exId);
    if (ex && workout.reps !== "" && workout.reps != null) appendHistory(workout.exId, ex.weight, workout.reps);
  }
  function woNext() {
    if (!workout) return;
    logWorkoutReps();
    const idx = day.exercises.findIndex((e) => e.id === workout.exId);
    const ordered = [...day.exercises.slice(idx + 1), ...day.exercises.slice(0, idx)];
    const next = ordered.find((e) => getArr(e).some((d) => !d));
    if (next) startWorkout(next.id);
    else { setWorkout(null); setOverlayOpen(false); }
  }
  function woFinish() {
    logWorkoutReps();
    setWorkout(null);
    setOverlayOpen(false);
  }
  function woStop() {
    setWorkout(null);
    setOverlayOpen(false);
    showToast("Ejercicio detenido");
  }

  /* ticking global del entrenamiento */
  useEffect(() => {
    if (!workout) return;
    const active = workout.phase === "work" || (workout.phase === "rest" && workout.restRunning);
    if (!active) return;
    const id = setInterval(() => {
      const t = Date.now();
      if (workout.phase === "rest" && workout.restRunning && workout.restEndAt && workout.restEndAt - t <= 0) {
        fireAlarm();
        woAdvance();
      } else {
        setNow(t);
      }
    }, 200);
    return () => clearInterval(id);
  }, [workout, settings.soundOn]);

  /* ---- temporizador manual ---- */
  function startTimer(sec) {
    ensureAudio();
    setTotal(sec); setRemaining(sec); setEndAt(Date.now() + sec * 1000); setRunning(true);
  }
  function pauseResume() {
    if (running) { setRemaining(Math.max(0, (endAt - Date.now()) / 1000)); setRunning(false); setEndAt(null); }
    else if (remaining > 0) { ensureAudio(); setEndAt(Date.now() + remaining * 1000); setRunning(true); }
  }
  function addTime(sec) {
    if (running) { setEndAt((e) => (e || Date.now()) + sec * 1000); setTotal((t) => t + sec); }
    else { setRemaining((r) => r + sec); setTotal((t) => Math.max(t, remaining + sec)); }
  }
  function stopTimer() { setRunning(false); setEndAt(null); setRemaining(0); setTotal(0); }
  useEffect(() => {
    if (!running || endAt == null) return;
    const id = setInterval(() => {
      const rem = Math.max(0, (endAt - Date.now()) / 1000);
      if (rem <= 0) { clearInterval(id); setRemaining(0); setRunning(false); setEndAt(null); fireAlarm(); }
      else { setRemaining(rem); }
    }, 150);
    return () => clearInterval(id);
  }, [running, endAt, settings.soundOn]);

  /* ---- respaldo ---- */
  function exportData() {
    try {
      const data = { app: "mi-rutina", version: 3, exported: new Date().toISOString(), routine, history, sessions, settings };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "mi-rutina-respaldo.json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast("Respaldo descargado ✓");
    } catch (e) { showToast("No se pudo exportar"); }
  }
  function importData(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !data.routine || !data.routine.days) throw new Error("inválido");
        persistRoutine(data.routine);
        persistHistory(data.history || {});
        if (Array.isArray(data.sessions)) persistSessions(data.sessions);
        if (data.settings) updSettings(data.settings);
        setDayIdx(0);
        showToast("Datos restaurados ✓");
      } catch (e) { showToast("Archivo de respaldo inválido"); }
    };
    reader.readAsText(file);
  }

  const doneCount = day.exercises.reduce((acc, ex) => acc + getArr(ex).filter(Boolean).length, 0);
  const totalCount = day.exercises.reduce((acc, ex) => acc + ex.sets, 0);
  const dayDone = totalCount > 0 && doneCount === totalCount;

  useEffect(() => {
    if (dayDone && !prevDoneRef.current) {
      setCelebrate(true);
      vibrate([60, 60, 60, 60, 120]);
      const id = setTimeout(() => setCelebrate(false), 3200);
      return () => clearTimeout(id);
    }
    prevDoneRef.current = dayDone;
  }, [dayDone]);

  const summary = (() => {
    const rows = [];
    const totals = {};
    let progressed = 0;
    day.exercises.forEach((ex) => {
      const h = history[ex.id];
      if (!h || h.length === 0) return;
      const numEntries = h.filter((e) => e.n != null);
      const startN = numEntries.length ? numEntries[0].n : null;
      const p = parseWeight(ex.weight);
      const curN = p.num;
      const suffix = p.suffix;
      const gain = startN != null && curN != null ? Math.round((curN - startN) * 100) / 100 : null;
      const repsEntries = h.filter((e) => e.reps != null);
      const startReps = repsEntries.length ? repsEntries[0].reps : null;
      const lastReps = repsEntries.length ? repsEntries[repsEntries.length - 1].reps : null;
      const repsGain = startReps != null && lastReps != null ? lastReps - startReps : null;
      const startStr = numEntries.length ? compose(startN, suffix) : h[0].w;
      const improved = (gain != null && gain > 0) || (repsGain != null && repsGain > 0);
      if (improved) progressed++;
      if (gain != null && gain !== 0 && suffix) totals[suffix] = Math.round(((totals[suffix] || 0) + gain) * 100) / 100;
      rows.push({ id: ex.id, name: ex.name, startStr, curStr: ex.weight, gain, repsGain });
    });
    return { rows, totals, progressed };
  })();

  const workoutEx = workout ? exById(workout.exId) : null;
  let nextEx = null;
  if (workoutEx) {
    const idx = day.exercises.findIndex((e) => e.id === workout.exId);
    if (idx >= 0) {
      const ordered = [...day.exercises.slice(idx + 1), ...day.exercises.slice(0, idx)];
      nextEx = ordered.find((e) => getArr(e).some((d) => !d)) || null;
    }
  }

  const manualActive = running || remaining > 0;
  const displaySec = Math.ceil(remaining);
  const mm = Math.floor(displaySec / 60);
  const ss = String(displaySec % 60).padStart(2, "0");
  const frac = total > 0 ? Math.min(1, Math.max(0, remaining / total)) : 0;
  const pct = totalCount ? Math.round((doneCount / totalCount) * 100) : 0;

  return (
    <div className="wrap">
      <style>{CSS}</style>

      <header className="top">
        <div className="brand">
          <span className="brand-logo" />
          <span className="brand-name">Mi Rutina</span>
          <span className="brand-tag">PRO</span>
          <div className="brand-actions">
            <button
              className={"icon-btn ble-btn" + (bleState.connected ? " on" : bleState.connecting ? " busy" : isDemoMode ? " demo" : "")}
              onClick={handleBleClick}
              title={bleState.connected ? `Sensor Seeed Conectado (${telemetryRef.current?.hz || 40} Hz) - Ver gráficas` : isDemoMode ? "Modo Demo Activo - Ver gráficas" : "Ver gráficas y telemetría de sensores Seeed Studio"}
              aria-label="Sensor Bluetooth Seeed"
            >
              📡
              {bleState.connected && <span className="ble-dot-on" />}
              {isDemoMode && <span className="ble-dot-demo" />}
            </button>
            <button className="icon-btn" onClick={() => setSessionsOpen(true)} aria-label="Bitácora de sesiones">
              📒
              {sessions.length > 0 && <span className="icon-badge">{sessions.length > 99 ? "99+" : sessions.length}</span>}
            </button>
          </div>
        </div>
        <div className="days">
          {routine.days.map((d, i) => (
            <button key={d.id} className={"day-btn" + (i === safeDayIdx ? " on" : "")} onClick={() => changeDay(i)}>
              <span className="day-n">Día {i + 1}</span>
              <span className="day-f">{d.focus}</span>
            </button>
          ))}
          <button className="day-btn add" onClick={() => setDayForm({ mode: "new" })} aria-label="Agregar día">
            <span className="day-n">＋</span>
            <span className="day-f">Día</span>
          </button>
        </div>

        <div className="hero">
          <div className="hero-row">
            <span className="hero-focus">{day.body || day.focus}</span>
            <button className="day-edit" onClick={() => setDayForm({ mode: "edit" })}>✎ Editar</button>
          </div>
          {day.note ? <div className="note">{day.note}</div> : null}
          <div className="progress">
            <div className="progress-head">
              <span>{dayDone ? "¡Día completo! 💪" : "Series completadas"}</span>
              <span className="count">{doneCount}<span className="count-sep">/</span>{totalCount} · {pct}%</span>
            </div>
            <div className="bar">
              <div className={"bar-fill" + (dayDone ? " full" : "")} style={{ width: totalCount ? `${pct}%` : "0%" }} />
            </div>
            <div className="head-actions">
              <button className="reset" onClick={() => setSummaryOpen((v) => !v)}>
                {summaryOpen ? "Ocultar resumen" : "📊 Resumen del día"}
              </button>
              <button className="reset sensor-nav-btn" onClick={() => setSensorMonitorOpen(true)}>
                📡 Sensores Seeed {bleState.connected ? "🟢" : isDemoMode ? "🟣" : ""}
              </button>
              <button className="reset" onClick={resetDay}>Reiniciar día</button>
            </div>
          </div>
        </div>
      </header>

      <main className="list">
        {summaryOpen && (
          <div className="summary rise">
            <div className="sum-title">Resumen · Día {safeDayIdx + 1} <span className="sum-focus">({day.focus})</span></div>
            <div className="sum-stats">
              <div className="sum-stat"><span className="sum-num">{doneCount}/{totalCount}</span><span className="sum-lbl">series hoy</span></div>
              <div className="sum-stat"><span className="sum-num">{summary.progressed}</span><span className="sum-lbl">con progreso</span></div>
            </div>
            {Object.keys(summary.totals).length > 0 && (
              <div className="sum-totals">
                <span className="sum-totals-lbl">Carga total agregada</span>
                <div className="sum-chips">
                  {Object.entries(summary.totals).map(([suf, val]) => (
                    <span key={suf} className={"sum-chip" + (val > 0 ? " up" : "")}>
                      {val > 0 ? "+" : "−"}{fmtNum(Math.abs(val))} {suf}
                    </span>
                  ))}
                </div>
              </div>
            )}
            {summary.rows.length === 0 ? (
              <div className="sum-empty">Aún no registras cambios este día. Edita un peso o anota tus reps para empezar a ver tu progreso.</div>
            ) : (
              <div className="sum-list">
                {summary.rows.map((r) => (
                  <div className="sum-row" key={r.id}>
                    <span className="sum-ex">{r.name}</span>
                    <span className="sum-prog">
                      <span className="sum-from">{r.startStr}</span>
                      <span className="sum-arrow">→</span>
                      <span className="sum-to">{r.curStr}</span>
                    </span>
                    <span className="sum-badges">
                      {r.gain != null && r.gain !== 0 && (
                        <span className={"sum-gain" + (r.gain > 0 ? " up" : " down")}>
                          {r.gain > 0 ? "+" : "−"}{fmtNum(Math.abs(r.gain))}
                        </span>
                      )}
                      {r.repsGain != null && r.repsGain > 0 && (
                        <span className="sum-gain reps">+{r.repsGain} rep{r.repsGain > 1 ? "s" : ""}</span>
                      )}
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {day.exercises.length === 0 && (
          <div className="empty-day rise">
            <span className="empty-ico">🏋️</span>
            Este día aún no tiene ejercicios.<br />¡Agrega el primero! 👇
          </div>
        )}

        {day.exercises.map((ex, ei) => {
          const arr = getArr(ex);
          const done = arr.filter(Boolean).length;
          const allDone = done === ex.sets;
          const isActive = workout && workout.exId === ex.id;
          return (
            <div className={"card rise" + (allDone ? " card-done" : "") + (isActive ? " card-active" : "")} key={ex.id} style={{ animationDelay: `${Math.min(ei * 0.04, 0.3)}s` }}>
              <div className="card-top">
                <div className="ex-text">
                  <div className="ex-name">{ex.name}{isActive ? <span className="active-tag">EN CURSO</span> : null}</div>
                  {ex.sub ? <div className="ex-sub">{ex.sub}</div> : null}
                </div>
                <button className="weight" onClick={() => (editingEx === ex.id ? closeEditor() : openEditor(ex))}>
                  {ex.weight}<span className="pencil">✎</span>
                </button>
              </div>

              <div className="meta">
                <span className="chip-meta">{ex.sets} series</span>
                <span className="chip-meta">{ex.reps} reps</span>
                <span className="chip-meta soft">⏱ {ex.rest != null ? `${ex.rest}s` : `${settings.globalRest}s`}</span>
                <button className="chip-meta btn" onClick={() => setExForm({ mode: "edit", ex })}>✎</button>
                <button className="chip-meta btn" onClick={() => moveExercise(ex.id, -1)} disabled={ei === 0}>↑</button>
                <button className="chip-meta btn" onClick={() => moveExercise(ex.id, 1)} disabled={ei === day.exercises.length - 1}>↓</button>
              </div>

              {editingEx === ex.id && (
                <div className="editor rise-fast">
                  {editNumeric ? (
                    <React.Fragment>
                      <div className="ed-display">
                        <input className="ed-input" inputMode="decimal" value={editVal} onChange={(e) => commitNumeric(e.target.value)} />
                        {editSuffix ? <span className="ed-unit">{editSuffix}</span> : null}
                      </div>
                      <div className="ed-steps">
                        {STEPS.map((d) => (
                          <button key={d} className="step" onClick={() => stepBy(d)}>{d > 0 ? `+${d}` : `−${Math.abs(d)}`}</button>
                        ))}
                      </div>
                    </React.Fragment>
                  ) : (
                    <input className="ed-input text" value={editVal} placeholder="Escribe el peso" onChange={(e) => commitText(e.target.value)} />
                  )}
                  <div className="ed-reps">
                    <div className="ed-reps-label">Reps logradas<span className="ed-reps-goal">objetivo {ex.reps}</span></div>
                    <div className="ed-reps-ctrl">
                      <button className="rep-step" onClick={() => setEditReps(String(Math.max(0, (parseInt(editReps) || 0) - 1)))}>−</button>
                      <input className="ed-input reps" inputMode="numeric" value={editReps} placeholder="—" onChange={(e) => setEditReps(e.target.value.replace(/[^\d]/g, ""))} />
                      <button className="rep-step" onClick={() => setEditReps(String((parseInt(editReps) || 0) + 1))}>+</button>
                    </div>
                  </div>
                  <div className="ed-foot">
                    <span className="ed-sug">Se guarda en el historial</span>
                    <button className="ed-done" onClick={closeEditor}>Listo</button>
                  </div>
                </div>
              )}

              {ex.tip ? <div className="tip">{ex.tip}</div> : null}

              <div className="dots">
                {arr.map((d, si) => (
                  <button key={si} className={"dot" + (d ? " done" : "")} onClick={() => toggleSet(ex, si)} aria-label={`Serie ${si + 1}`}>
                    {d ? "✓" : si + 1}
                  </button>
                ))}
              </div>

              <button className={"start-btn" + (allDone ? " finished" : "") + (isActive ? " active" : "")}
                onClick={() => { if (isActive) setOverlayOpen(true); else if (!allDone) startWorkout(ex.id); }}
                disabled={allDone && !isActive}>
                {isActive ? "↑ Volver al ejercicio" : allDone ? "✓ Completado" : done > 0 ? `▶ Continuar · serie ${done + 1} de ${ex.sets}` : "▶ Iniciar ejercicio"}
              </button>

              {history[ex.id] && history[ex.id].length > 0 && (
                <React.Fragment>
                  <button className="hist-toggle" onClick={() => setHistOpen(histOpen === ex.id ? null : ex.id)}>
                    <span>📈 {histOpen === ex.id ? "Ocultar progreso" : "Progreso"}</span>
                    <span className="hist-count">{history[ex.id].length}</span>
                  </button>
                  {histOpen === ex.id && <HistoryPanel entries={history[ex.id]} onClear={() => clearHistory(ex.id)} />}
                </React.Fragment>
              )}
            </div>
          );
        })}

        <button className="add-ex" onClick={() => setExForm({ mode: "new" })}>＋ Agregar ejercicio</button>
        <div className="footer-space" />
        {workout && <div className="footer-space" />}
      </main>

      <footer className="timer">
        {workout && workoutEx ? (
          <WorkoutBar ex={workoutEx} w={workout} onReopen={() => setOverlayOpen(true)} />
        ) : manualActive ? (
          <div className="t-run">
            <svg width="56" height="56" viewBox="0 0 56 56" className="ring">
              <circle cx="28" cy="28" r={RING_R} className="ring-bg" fill="none" />
              <circle cx="28" cy="28" r={RING_R} className="ring-fg" fill="none"
                strokeDasharray={RING_C} strokeDashoffset={RING_C * (1 - frac)} transform="rotate(-90 28 28)" />
            </svg>
            <div className="t-time">{mm}:{ss}</div>
            <div className="t-controls">
              <button className="t-btn" onClick={() => addTime(15)}>+15</button>
              <button className="t-btn primary" onClick={pauseResume}>{running ? "Pausa" : "Seguir"}</button>
              <button className="t-btn ghost" onClick={stopTimer}>✕</button>
            </div>
          </div>
        ) : (
          <React.Fragment>
            <div className="t-idle">
              <div className="t-label">Descanso</div>
              <div className="t-presets">
                {PRESETS.map((p) => (<button key={p} className="preset" onClick={() => startTimer(p)}>{p}s</button>))}
              </div>
              <div className="t-toggles">
                <button className={"toggle" + (settings.autoRest ? " on" : "")} onClick={() => updSettings({ autoRest: !settings.autoRest })}>Auto ⏱</button>
                <button className={"toggle" + (settings.soundOn ? " on" : "")} onClick={() => updSettings({ soundOn: !settings.soundOn })}>{settings.soundOn ? "🔔" : "🔕"}</button>
                <button className={"toggle" + (gearOpen ? " on" : "")} onClick={() => setGearOpen((v) => !v)}>⚙</button>
              </div>
            </div>
            {gearOpen && (
              <div className="gear rise-fast">
                <div className="gear-row">
                  <span className="gear-lbl">Descanso global</span>
                  <div className="gear-ctrl">
                    <button className="t-btn" onClick={() => updSettings({ globalRest: Math.max(10, settings.globalRest - 15) })}>−15</button>
                    <span className="gear-val">{settings.globalRest}s</span>
                    <button className="t-btn" onClick={() => updSettings({ globalRest: settings.globalRest + 15 })}>+15</button>
                  </div>
                </div>
                <div className="gear-row">
                  <span className="gear-lbl">Bitácora de sesiones</span>
                  <div className="gear-ctrl">
                    <button className="t-btn" onClick={() => setSessionsOpen(true)}>📒 Ver</button>
                    <button className="t-btn" onClick={exportSessionsCSV} disabled={sessions.length === 0}>⬇ CSV</button>
                  </div>
                </div>
                <div className="gear-row">
                  <span className="gear-lbl">Respaldo completo</span>
                  <div className="gear-ctrl">
                    <button className="t-btn" onClick={exportData}>⬇ Exportar</button>
                    <button className="t-btn" onClick={() => fileRef.current && fileRef.current.click()}>⬆ Importar</button>
                    <input ref={fileRef} type="file" accept=".json,application/json" style={{ display: "none" }}
                      onChange={(e) => { const f = e.target.files && e.target.files[0]; if (f) importData(f); e.target.value = ""; }} />
                  </div>
                </div>
              </div>
            )}
          </React.Fragment>
        )}
      </footer>

      {toast && <div className="toast" key={toast}>{toast}</div>}
      {celebrate && <Confetti />}

      {exForm && (
        <ExerciseForm
          initial={exForm.mode === "edit" ? exForm.ex : null}
          globalRest={settings.globalRest}
          onCancel={() => setExForm(null)}
          onSave={(data) => {
            if (exForm.mode === "edit") { updateExercise(exForm.ex.id, data); showToast("Ejercicio actualizado ✓"); }
            else addExercise(data);
            setExForm(null);
          }}
          onDelete={exForm.mode === "edit" ? () => { deleteExercise(exForm.ex.id); setExForm(null); } : null}
        />
      )}

      {dayForm && (
        <DayForm
          initial={dayForm.mode === "edit" ? day : null}
          canDelete={routine.days.length > 1}
          onCancel={() => setDayForm(null)}
          onSave={(data) => { if (dayForm.mode === "edit") updateDay(data); else addDay(data); setDayForm(null); }}
          onDelete={deleteDay}
        />
      )}

      {workout && workoutEx && overlayOpen && (
        <WorkoutOverlay
          ex={workoutEx}
          w={workout}
          doneArr={getArr(workoutEx)}
          nextEx={nextEx}
          onComplete={woComplete}
          onAdvance={woAdvance}
          onAddTime={woAddTime}
          onPauseResume={woPauseResume}
          onSetReps={woSetReps}
          onClose={() => setOverlayOpen(false)}
          onNext={woNext}
          onFinish={woFinish}
          onStop={woStop}
          bleState={bleState}
          onConnectBle={connectBLE}
          calib={calib}
          calibProfile={calibProfiles[workoutEx.id] || null}
          onCalibStart={() => calibStart(workoutEx.id)}
          onCalibFinish={calibFinish}
          onCalibCancel={calibCancel}
          onCalibReset={() => calibReset(workoutEx.id)}
          onOpenSensorMonitor={() => setSensorMonitorOpen(true)}
          wavePoints={wavePoints}
        />
      )}

      {sessionsOpen && (
        <SessionsScreen sessions={sessions} onClose={() => setSessionsOpen(false)} onExport={exportSessionsCSV} onClear={clearSessions} />
      )}

      {sensorMonitorOpen && (
        <SensorMonitorModal
          bleState={bleState}
          telemetryRef={telemetryRef}
          onConnect={connectBLE}
          onDisconnect={disconnectBLE}
          onClose={() => setSensorMonitorOpen(false)}
          isDemo={isDemoMode}
          onStartDemo={startDemoTelemetry}
          onStopDemo={stopDemoTelemetry}
          onClearTelemetry={clearTelemetry}
          calibCount={Object.keys(calibProfiles).length}
          onExportCalib={exportCalib}
          onImportCalib={importCalib}
        />
      )}
    </div>
  );
}
